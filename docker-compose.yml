services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oktclone
      POSTGRES_USER: oktclone
      POSTGRES_PASSWORD: oktclone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oktclone"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
